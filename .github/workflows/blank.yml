name: Gustaxy - montar patch e compilar APK

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Compilar tambem o APK Android
        required: true
        type: boolean
        default: true

  push:
    branches: [main, master]
    paths:
      - gustaxy-source.zip
      - .github/workflows/gustaxy-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abrir o ZIP do projeto
        run: |
          set -euo pipefail

          test -s gustaxy-source.zip

          mkdir -p workspace
          unzip -oq gustaxy-source.zip -d workspace

          test -f workspace/tools/patch/build_patch.py
          test -f workspace/patch_inputs/DummyDll.zip

      - name: Instalar somente as dependencias do montador
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -r workspace/tools/patch/requirements.txt

      - name: Montar bytecode IFix, validar e empacotar os bundles
        run: |
          set -euo pipefail

          cd workspace

          python tools/patch/build_patch.py

          test -s build-output/nome-animado/report.json
          test -s build-output/nome-animado/fileinfo
          test -s build-output/somente-cor/report.json

      - name: Disponibilizar assembly, fileinfo e relatorios
        uses: actions/upload-artifact@v4
        with:
          name: gustaxy-patch-para-teste
          path: |
            workspace/build-output/nome-animado/
            workspace/build-output/somente-cor/
            workspace/build-output/build-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Empacotar o fonte com os assets atualizados
        run: |
          set -euo pipefail

          cd workspace

          zip -qr ../gustaxy-fonte-atualizado.zip . \
            -x 'build-output/*' \
               '*/__pycache__/*' \
               '.gradle/*' \
               'app/build/*'

      - name: Disponibilizar fonte atualizado
        uses: actions/upload-artifact@v4
        with:
          name: gustaxy-fonte-atualizado
          path: gustaxy-fonte-atualizado.zip
          if-no-files-found: error
          retention-days: 14

      - name: Preparar JDK 17
        if: github.event_name != 'workflow_dispatch' || inputs.build_apk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        if: github.event_name != 'workflow_dispatch' || inputs.build_apk
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar SDK, NDK e CMake do projeto
        if: github.event_name != 'workflow_dispatch' || inputs.build_apk
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Verificar ferramentas Android
        if: github.event_name != 'workflow_dispatch' || inputs.build_apk
        run: |
          set -euo pipefail

          sdkmanager --list_installed

          test -d "${ANDROID_SDK_ROOT}/platforms/android-35"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          test -d "${ANDROID_SDK_ROOT}/ndk/26.3.11579264"
          test -d "${ANDROID_SDK_ROOT}/cmake/3.22.1"

      - name: Compilar APK debug de verdade
        if: github.event_name != 'workflow_dispatch' || inputs.build_apk
        run: |
          set -euo pipefail

          cd workspace

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -n "$(find app/build/outputs/apk/debug \
            -name '*.apk' \
            -print \
            -quit)"

      - name: Disponibilizar APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: gustaxy-apk-debug
          path: workspace/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar logs Android em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gustaxy-build-diagnostico
          path: |
            workspace/app/build/reports/
            workspace/app/build/outputs/logs/
            workspace/build-output/build-summary.json
          if-no-files-found: warn
          retention-days: 7
